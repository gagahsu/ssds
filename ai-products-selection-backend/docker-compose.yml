services:
  postgres:
    image: postgres:17-alpine
    container_name: ssds-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ssds_local_dev
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ssds_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ssds_pgdata:
    external: true
