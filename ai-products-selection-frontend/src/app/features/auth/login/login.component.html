<div class="login-page">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>SSDS 團購選品策略系統</mat-card-title>
      <mat-card-subtitle>請登入以繼續</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>電子郵件</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="username" />
          @if (form.controls.email.invalid && form.controls.email.touched) {
            <mat-error>請輸入有效的電子郵件</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>密碼</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password" />
          @if (form.controls.password.invalid && form.controls.password.touched) {
            <mat-error>請輸入密碼</mat-error>
          }
        </mat-form-field>

        @if (errorMessage()) {
          <p class="error-message">{{ errorMessage() }}</p>
        }

        <button mat-flat-button color="primary" type="submit" class="full-width" [disabled]="loading()">
          @if (loading()) {
            <mat-spinner diameter="20"></mat-spinner>
          } @else {
            登入
          }
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
